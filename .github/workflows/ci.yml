name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MODEL_PROFILE: offline
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.28" }
      - run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Repo rules (gigsim unchanged, prompts in agent/prompts, no secrets, README numbers traced)
        run: uv run python -m scripts.ci_checks
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build portfolio indexes
        run: uv run python -m rag.ingest.build
      - name: Unit + contract (MCP schema snapshot) + MCP in-memory tests
        run: uv run pytest -q tests/unit tests/contract mcp_servers gigsim/tests
      - name: Integration (graphs and API against in-process GigSim)
        run: uv run pytest -q tests/integration

  e2e:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.28" }
      - run: uv sync --frozen --extra dev
      - run: uv run python -m rag.ingest.build
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - working-directory: apps/web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts   # generated client must match the FastAPI schema
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }
