[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
  "httpx",
  "python-dotenv",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langgraph-checkpoint-sqlite",
  "langgraph-supervisor",
  "langchain-core",
  "langchain-openai",
  "langchain-mcp-adapters",
  "mcp",
  "sqlalchemy",
  "psycopg[binary,pool]",
  "aiosqlite",
  "redis",
  "arq",
  "qdrant-client",
  "fastembed",
  "rank-bm25",
  "networkx",
  "numpy",
  "pypdf",
  "fpdf2",
  "cryptography",
  "sse-starlette",
  "tzdata",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "openinference-instrumentation-langchain",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "rag", "mcp_servers", "worker", "gigsim", "evals"]

[tool.ruff]
line-length = 110
extend-exclude = ["apps/web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "mcp_servers", "gigsim/tests"]
