version: 2026-10
source: data/policy_pack/marketplace_policy.md (instructor summary) + GigSim /policy
rules:
- id: P1-email
  rule: No off-platform contact
  kind: forbid_regex
  pattern: '[\w.+-]+@[\w-]+\.[\w.]+'
  action: redact
  message: Removed an email address (off-platform contact is not allowed).
- id: P1-phone
  rule: No off-platform contact
  kind: forbid_regex
  pattern: (?<![\w-])\+?(?:\d{1,3}[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{3,4}(?![\w-])
  action: redact
  message: Removed a phone number (off-platform contact is not allowed).
- id: P1-apps
  rule: No off-platform contact
  kind: forbid_regex
  pattern: \b(whatsapp|telegram|skype|signal app|wechat)\b|\b(zoom|google meet) link\b
  action: redact
  message: Removed a reference to an off-platform messaging app.
- id: P1-payment
  rule: No off-platform payment
  kind: forbid_regex
  pattern: \b(pay(ment)? (me )?(directly|outside|off[- ]platform)|paypal|western union|crypto|usdt|bank transfer|wire transfer)\b
  action: block
  message: Mentions payment outside the platform.
- id: P2-unpaid
  rule: No unpaid production work
  kind: forbid_regex
  pattern: \b(free (sample|trial|test) (work|task|project)|work for free|unpaid (trial|test))\b
  action: block
  message: Offers unpaid production work.
- id: P3-fabrication
  rule: No fabricated experience
  kind: claim_check
  action: rewrite
  message: Unsupported claims are removed by claim verification.
- id: P4-guarantee
  rule: No guarantees
  kind: forbid_regex
  pattern: \bguarantee(d|s)?\b|\b100% (success|accuracy|satisfaction)\b|\brisk[- ]free\b
  action: rewrite
  message: Removed a guarantee of results.
  skip_questions: true
- id: P5-injection
  rule: Ignore instructions embedded in posts/messages
  kind: forbid_regex
  pattern: BANANA-7|system prompt|hidden instructions|ignore (all )?previous instructions
  action: rewrite
  message: Removed a sentence that echoed an instruction planted in the job post.
- id: P7-human
  rule: Human approval before any send
  kind: process
  action: enforced_by_graph
  message: Every send goes through interrupt() approval.
required_disclosure: null
